name: Publish and deploy Samogon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samogon-production
  cancel-in-progress: false

env:
  IMAGE_NAME: alserloz/samogon_chat

jobs:
  publish:
    name: Publish image to Docker Hub
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy on infra-dev
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Unlock deployment key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > "$RUNNER_TEMP/ssh-askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh-askpass"
          eval "$(ssh-agent -s)"
          DISPLAY=1 SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" \
            SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/id_ed25519 < /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Pull and restart application
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE'" <<'REMOTE'
          set -eu

          image=$1
          env_file=/srv/config/env/samogon.env
          compose_dir=/srv/compose/samogon
          data_dir=/srv/data/samogon

          compose_for_image() {
            local selected_image=$1
            shift
            env SAMOGON_IMAGE="$selected_image" \
                SAMOGON_ENV_FILE="$env_file" \
                SAMOGON_DATA_DIR="$data_dir" \
                docker compose -f compose.yaml "$@"
          }

          cd "$compose_dir"
          previous_web_image=$(docker inspect \
            --format '{{.Config.Image}}' samogon-web 2>/dev/null || true)
          previous_worker_image=$(docker inspect \
            --format '{{.Config.Image}}' samogon-worker 2>/dev/null || true)
          rollback_image=""
          if [ -n "$previous_web_image" ] \
              && [ "$previous_web_image" = "$previous_worker_image" ]; then
            rollback_image=$previous_web_image
          fi

          compose_for_image "$image" pull samogon-web samogon-worker

          if ! grep -q '^VAPID_PUBLIC_KEY=.' "$env_file" \
              || ! grep -q '^VAPID_PRIVATE_KEY=.' "$env_file"; then
            umask 077
            keys_file=$(mktemp)
            next_env=$(mktemp "${env_file}.XXXXXX")
            trap 'rm -f "$keys_file" "$next_env"' EXIT

            docker run --rm --entrypoint python "$image" \
              /app/manage.py generate_vapid_keys > "$keys_file"
            grep -v '^VAPID_' "$env_file" > "$next_env" || true
            cat "$keys_file" >> "$next_env"
            printf '%s\n' 'VAPID_SUBJECT=https://sam.pyconstrictor.ru' >> "$next_env"
            chmod --reference="$env_file" "$next_env"
            chown --reference="$env_file" "$next_env"
            mv "$next_env" "$env_file"
            rm -f "$keys_file"
            trap - EXIT
          fi

          deployment_started=1
          rollback_deployment() {
            deploy_status=$?
            trap - EXIT
            if [ "$deploy_status" -eq 0 ] || [ "$deployment_started" -ne 1 ]; then
              exit "$deploy_status"
            fi

            set +e
            echo "Deployment failed; collecting logs before rollback."
            compose_for_image "$image" logs --tail=100 samogon-web samogon-worker
            if [ -z "$rollback_image" ]; then
              echo "No single previous image is available for automatic rollback."
              exit "$deploy_status"
            fi

            echo "Restoring the previously running application image."
            if ! compose_for_image "$rollback_image" up -d --no-build \
              samogon-web samogon-worker; then
              echo "Automatic rollback could not recreate the previous containers."
              exit "$deploy_status"
            fi

            rollback_web_ready=0
            for attempt in $(seq 1 60); do
              if docker exec samogon-web python -c \
                "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"; then
                rollback_web_ready=1
                break
              fi
              sleep 2
            done
            if [ "$rollback_web_ready" -ne 1 ]; then
              echo "Previous web image did not start after rollback."
              compose_for_image "$rollback_image" logs --tail=100 samogon-web
              exit "$deploy_status"
            fi

            rollback_worker_ready=0
            for attempt in $(seq 1 30); do
              if docker exec samogon-worker python \
                /app/deployment/docker/healthcheck.py worker; then
                rollback_worker_ready=1
                break
              fi
              sleep 2
            done
            if [ "$rollback_worker_ready" -ne 1 ]; then
              echo "Previous worker image did not become healthy after rollback."
              compose_for_image "$rollback_image" logs --tail=100 samogon-worker
            fi

            if docker exec nginx nginx -t; then
              docker exec nginx nginx -s reload
            else
              echo "Nginx configuration check failed during rollback."
            fi
            compose_for_image "$rollback_image" ps
            echo "Previous application image restored; deployment remains failed."
            exit "$deploy_status"
          }
          trap rollback_deployment EXIT

          compose_for_image "$image" up -d --no-build samogon-web samogon-worker

          web_ready=0
          for attempt in $(seq 1 60); do
            if docker exec samogon-web python \
              /app/deployment/docker/healthcheck.py web; then
              web_ready=1
              break
            fi
            sleep 2
          done
          if [ "$web_ready" -ne 1 ]; then
            compose_for_image "$image" logs --tail=100 samogon-web
            exit 1
          fi

          worker_ready=0
          for attempt in $(seq 1 30); do
            if docker exec samogon-worker python \
              /app/deployment/docker/healthcheck.py worker; then
              worker_ready=1
              break
            fi
            sleep 2
          done
          if [ "$worker_ready" -ne 1 ]; then
            compose_for_image "$image" logs --tail=100 samogon-worker
            exit 1
          fi

          docker exec nginx nginx -t
          docker exec nginx nginx -s reload
          compose_for_image "$image" ps
          deployment_started=0
          trap - EXIT
          REMOTE
