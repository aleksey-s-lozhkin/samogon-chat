name: Verify pull request

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # pip из wheel с проверкой SHA-256 — до него никаких установок.
      #
      # Причина: pip ниже 26.2.2 грузит встроенный certifi вдобавок к
      # системному хранилищу и не слушает его, поэтому доверяет подделанным
      # сертификатам eMudhra (инцидент 22.10.2026). `pip install poetry`
      # таким pip'ом — установка через скомпрометированное доверие.
      #
      # Хеш делает шаг безопасным независимо от версии pip на runner'е:
      # подменённый файл не сойдётся с SHA-256, и шаг упадёт.
      - name: Update pip
        run: |
          pip install --no-cache-dir \
            "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          pip --version

      # Poetry закреплён: без версии сборка невоспроизводима.
      - name: Install dependencies
        run: pip install --no-cache-dir "poetry==2.4.1" && poetry install --no-interaction --no-root --only main

      - name: Check Django configuration
        env:
          DEBUG: "0"
          ALLOWED_HOSTS: testserver
          SECRET_KEY: ci-only-configuration-check-secret-key-with-sufficient-length
          ALLOW_SQLITE_FALLBACK: "1"
        run: poetry run python manage.py check --deploy

      - name: Check that migrations are complete
        env:
          DEBUG: "0"
          ALLOWED_HOSTS: testserver
          SECRET_KEY: ci-only-migration-check-secret-key-with-sufficient-length
          ALLOW_SQLITE_FALLBACK: "1"
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Check production static manifest
        env:
          DEBUG: "0"
          ALLOWED_HOSTS: testserver
          SECRET_KEY: ci-only-static-manifest-secret-key-with-sufficient-length
          ALLOW_SQLITE_FALLBACK: "1"
        run: |
          poetry run python manage.py collectstatic --noinput --clear
          poetry run python manage.py test config.test_admin.AdminDiagnosticsTests.test_admin_index_renders

      - name: Run tests
        run: poetry run python manage.py test

      - name: Check release audit tools
        run: |
          poetry run python -m unittest scripts.test_release_tools
          bash -n scripts/verify_backup_restore.sh

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image without publishing
        run: docker build --tag samogon:pull-request .

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # pip из wheel с проверкой SHA-256 — до него никаких установок.
      #
      # Причина: pip ниже 26.2.2 грузит встроенный certifi вдобавок к
      # системному хранилищу и не слушает его, поэтому доверяет подделанным
      # сертификатам eMudhra (инцидент 22.10.2026). `pip install poetry`
      # таким pip'ом — установка через скомпрометированное доверие.
      #
      # Хеш делает шаг безопасным независимо от версии pip на runner'е:
      # подменённый файл не сойдётся с SHA-256, и шаг упадёт.
      - name: Update pip
        run: |
          pip install --no-cache-dir \
            "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          pip --version

      # Poetry закреплён: без версии сборка невоспроизводима.
      - name: Install dependencies
        run: pip install --no-cache-dir "poetry==2.4.1" && poetry install --no-interaction --no-root --with dev

      - name: Install browser engines
        run: poetry run playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: poetry run python scripts/browser_smoke.py

      - name: Check mobile moderation and admin
        run: poetry run python scripts/moderation_smoke.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-smoke-failure
          path: |
            test-results/browser-smoke/
            test-results/moderation-smoke/
          if-no-files-found: ignore
          retention-days: 7
