services:
  samogon-web:
    image: ${SAMOGON_IMAGE:?Set SAMOGON_IMAGE in .env.production}
    container_name: samogon-web
    restart: unless-stopped
    env_file: ${SAMOGON_ENV_FILE:-.env.production}
    volumes:
      - ${SAMOGON_DATA_DIR:-./.runtime}/static:/app/staticfiles
      - ${SAMOGON_DATA_DIR:-./.runtime}/media:/app/media
    networks:
      - infra

  samogon-worker:
    image: ${SAMOGON_IMAGE:?Set SAMOGON_IMAGE in .env.production}
    container_name: samogon-worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=INFO --concurrency=1
    env_file: ${SAMOGON_ENV_FILE:-.env.production}
    environment:
      SKIP_BOOTSTRAP: "1"
    networks:
      - infra

networks:
  infra:
    external: true
