<div id="login-modal" class="modal {% if user.is_authenticated %}hidden{% endif %}">
    <div class="modal-content">
        <section id="login-container">
            <header class="modal-header">
                <h2>Вход в чат</h2>
                <p>Войдите, чтобы продолжить</p>
            </header>

            <form
                id="login-form"
                hx-post="{% url 'login' %}"
                hx-target="#login-error"
                hx-swap="innerHTML"
            >
                {% csrf_token %}
                <div class="form-group">
                    <label for="login-username">Логин</label>
                    <input
                        id="login-username"
                        name="username"
                        type="text"
                        placeholder="Введите логин"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <div id="login-error" class="form-error"></div>
                <button type="submit" class="primary-button">Войти</button>
            </form>

            <div class="modal-footer">
                Нет аккаунта?
                <button type="button" id="show-register" class="link-button">
                    Зарегистрироваться
                </button>
            </div>
        </section>

        <section id="register-container" class="hidden">
            <header class="modal-header">
                <h2>Создание аккаунта</h2>
                <p>Заполните данные для регистрации</p>
            </header>

            <form
                id="register-form"
                hx-post="{% url 'register' %}"
                hx-target="#register-error"
                hx-swap="innerHTML"
            >
                {% csrf_token %}
                <div class="form-group">
                    <label for="register-username">Логин</label>
                    <input
                        id="register-username"
                        name="username"
                        type="text"
                        placeholder="Придумайте логин"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input
                        id="register-email"
                        name="email"
                        type="email"
                        placeholder="Введите email"
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input
                        id="register-password"
                        name="password"
                        type="password"
                        placeholder="Придумайте пароль"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Повторите пароль</label>
                    <input
                        id="register-password-confirm"
                        name="password_confirm"
                        type="password"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div id="register-error" class="form-error"></div>
                <button type="submit" class="primary-button">Создать аккаунт</button>
            </form>

            <div class="modal-footer">
                Уже есть аккаунт?
                <button type="button" id="show-login" class="link-button">Войти</button>
            </div>
        </section>
    </div>
</div>
