<aside
    class="presence-sidebar"
    :class="{ 'is-open': peopleOpen }"
    aria-label="Гости чата"
>
    <div class="presence-sidebar-header">
        <div>
            <span class="eyebrow">ЛЮДИ В БАРЕ</span>
            <h2>Гости</h2>
        </div>
        <button
            class="presence-close"
            type="button"
            @click="peopleOpen = false"
            aria-label="Закрыть список гостей"
        >
            ×
        </button>
    </div>

    {% if user.is_authenticated %}
        <label class="presence-status-control presence-sidebar-status" for="presence-status-select">
            <span>Мой статус</span>
            <select id="presence-status-select" aria-label="Мой статус">
                <option value="" {% if not user.presence_status %}selected{% endif %}>Без статуса</option>
                {% for value, label in presence_status_choices %}
                    <option value="{{ value }}" {% if user.presence_status == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
    {% endif %}

    {% if user.is_authenticated %}
    <details class="bartender-guest" id="bartender-guest">
        <summary>
            <span class="user-avatar" aria-hidden="true">СЕ</span>
            <span class="user-contact-identity">
                <span class="user-contact-name">Семён</span>
                <span class="user-contact-status">Бармен · ИИ</span>
            </span>
        </summary>
        <div class="bartender-guest-actions">
            <button type="button" data-bartender-action="public"
                @click="peopleOpen = false; $el.closest('details').open = false">
                Обратиться в беседе
            </button>
            <button type="button" data-bartender-action="private"
                @click="peopleOpen = false; $el.closest('details').open = false">
                Написать лично
            </button>
        </div>
    </details>
    {% endif %}

    <section class="online-users user-presence-panel">
        <div class="presence-panel-title">
            <div class="online-title">
                <span class="online-dot"></span>
                Сейчас в баре
            </div>
            <span id="online-users-count" class="presence-count">0</span>
        </div>
        <div id="online-users-list"></div>
        <button
            id="toggle-online-users"
            class="presence-toggle hidden"
            type="button"
        ></button>
    </section>

    <section class="offline-users user-presence-panel">
        <div class="presence-panel-title">
            <div class="offline-title">
                <span class="offline-dot"></span>
                Отошли
            </div>
            <span id="offline-users-count" class="presence-count">0</span>
        </div>
        <div id="offline-users-list"></div>
        <button
            id="toggle-offline-users"
            class="presence-toggle hidden"
            type="button"
        ></button>
    </section>
</aside>

<div
    class="layout-overlay presence-overlay"
    x-show="peopleOpen"
    @click="peopleOpen = false"
    x-transition
></div>
