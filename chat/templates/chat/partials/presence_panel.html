<aside
    class="presence-sidebar"
    :class="{ 'is-open': peopleOpen }"
    aria-label="Гости чата"
>
    <div class="presence-sidebar-header">
        <div>
            <span class="eyebrow">ЛЮДИ В БАРЕ</span>
            <h2>Гости</h2>
        </div>
        <button
            class="presence-close"
            type="button"
            @click="peopleOpen = false"
            aria-label="Закрыть список гостей"
        >
            ×
        </button>
    </div>

    <section class="online-users user-presence-panel">
        <div class="presence-panel-title">
            <div class="online-title">
                <span class="online-dot"></span>
                За стойкой
            </div>
            <span id="online-users-count" class="presence-count">0</span>
        </div>
        <div id="online-users-list"></div>
        <button
            id="toggle-online-users"
            class="presence-toggle hidden"
            type="button"
        ></button>
    </section>

    <section class="offline-users user-presence-panel">
        <div class="presence-panel-title">
            <div class="offline-title">
                <span class="offline-dot"></span>
                Отошли ненадолго
            </div>
            <span id="offline-users-count" class="presence-count">0</span>
        </div>
        <div id="offline-users-list"></div>
        <button
            id="toggle-offline-users"
            class="presence-toggle hidden"
            type="button"
        ></button>
    </section>
</aside>

<div
    class="layout-overlay presence-overlay"
    x-show="peopleOpen"
    @click="peopleOpen = false"
    x-transition
></div>
