server {
    listen 80;
    server_name sam.pyconstrictor.ru;

    # Файлы проверки нужны Certbot и при продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sam.pyconstrictor.ru;

    ssl_certificate /etc/letsencrypt/live/sam.pyconstrictor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sam.pyconstrictor.ru/privkey.pem;

    client_max_body_size 10m;

    location /static/ {
        alias /var/www/samogon/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/samogon/media/;
        expires 1d;
    }

    location /ws/ {
        proxy_pass http://samogon-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://samogon-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
