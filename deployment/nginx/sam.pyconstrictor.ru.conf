server {
    listen 80;
    server_name sam.pyconstrictor.ru;

    # Файлы проверки нужны Certbot и при продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Скрытые файлы не должны попадать в Django даже при ошибочной публикации.
    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sam.pyconstrictor.ru;

    ssl_certificate /etc/letsencrypt/live/sam.pyconstrictor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sam.pyconstrictor.ru/privkey.pem;

    # Три изображения по 5 МБ с запасом на multipart-запрос.
    client_max_body_size 20m;
    limit_req zone=samogon_public burst=40 nodelay;
    limit_conn samogon_per_ip 15;
    limit_req_status 429;

    # Не передаём сканирование .env, .git и ключей в приложение.
    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location /static/ {
        alias /var/www/samogon/static/;
        access_log off;
        expires 7d;
    }

    # Вложения чата выдаёт только Django после проверки прав через X-Accel-Redirect.
    location ^~ /media/chat/attachments/ {
        internal;
        alias /var/www/samogon/media/chat/attachments/;
    }

    location /media/ {
        alias /var/www/samogon/media/;
        expires 1d;
    }

    location /ws/ {
        limit_req zone=samogon_websocket burst=8 nodelay;
        proxy_pass http://samogon-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://samogon-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /users/login/ {
        limit_req zone=samogon_auth burst=3 nodelay;
        proxy_pass http://samogon-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /users/register/ {
        limit_req zone=samogon_auth burst=3 nodelay;
        proxy_pass http://samogon-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
