# Этот файл Nginx загружает внутри блока http через conf.d/*.conf.
limit_req_zone $binary_remote_addr zone=samogon_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=samogon_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=samogon_websocket:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=samogon_per_ip:10m;
