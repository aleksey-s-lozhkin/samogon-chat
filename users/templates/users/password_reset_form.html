{% extends "users/auth_page.html" %}

{% block title %}Восстановление доступа{% endblock %}

{% block content %}
    <header class="modal-header">
        <h2>Восстановление доступа</h2>
        <p>Пришлём безопасную ссылку для нового пароля</p>
    </header>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email">Email</label>
            <input id="id_email" name="email" type="email" autocomplete="email" placeholder="Введите email" required autofocus>
            {{ form.email.errors }}
        </div>
        {{ form.non_field_errors }}
        <button class="primary-button" type="submit">Отправить ссылку</button>
    </form>
    <a class="auth-secondary-link" href="{% url 'chat:rooms' %}?auth=login">Вернуться ко входу</a>
{% endblock %}
